---
Managed: false
StepByStep: true
IdleKeepState: false

StatesLibraries:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@"

StatesFiles:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"

VerboseStateFactory: false

robots:
  ground:
    module: env/ground

robot:
  base_body: pelvis
  observation_source: realRobot

collisions:
  - type: collision
    useMinimal: true

ObserverPipelines:
  name: MainPipeline
  gui: true
  log: true

  observers:
    - type: Encoder
      config:
          velocity: encoderVelocities
    - type: BodySensor
      update: true
      bodySensor: FloatingBase
    - type: Tilt
      required: true
      update: true
      config:
        anchorFrameFunction: anchorFrameFunction
        filterGains:
          initAlpha: 2
          initBeta: 2
          initGamma: 1
          finalAlpha: 2
          finalBeta: 2
          finalGamma: 1
    - type: ExternalForcesObserver
      estimation_method: MomentumObserver
      use_forces_from_ft_sensors: false
      residual_gain: 100
      torque_source_type: CommandedTorque


states: {}

transitions:
  - [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]

init: NewRLQPController_Initial

policies_root: "@CMAKE_CURRENT_SOURCE_DIR@/policies"


default_policy: standing_h1
